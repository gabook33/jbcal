<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JB's 캘린더</title>
  <meta name="description" content="JB 전용 캘린더">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JB's 캘린더">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-v12.ico" sizes="any">
  <link rel="icon" href="icons/icon-v12.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32-v12.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-16-v12.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v12.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 빠른 입력: 데스크톱은 왼쪽 위 ＋ 아래에 뜨는 작은 창, 휴대폰은 아래에서 올라오는 시트 -->
    <header class="topbar" id="quickPop">
      <div class="qsheet" id="quickSheet" role="dialog" aria-label="새 일정 빠른 입력">
        <div class="qs-grab"></div>
        <div class="qs-head">
          <button type="button" class="qs-btn" id="qsCancel">취소</button>
          <strong>새 일정</strong>
          <button type="submit" class="qs-btn strong" id="qsAdd" form="quickForm">추가</button>
        </div>
        <form class="quick" id="quickForm" autocomplete="off">
          <svg class="quick-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="quick" type="text" enterkeyhint="done"
            placeholder="빠른 입력: 내일 오후 3시 팀 회의 @본관 /업무" aria-label="자연어로 일정 추가">
          <div class="quick-preview" id="quickPreview" hidden></div>
        </form>
        <p class="qs-hint">예) 내일 오후 3시 팀 회의 @본관 /업무 · 매주 월수금 9시 스탠드업 · 격주 금요일 3시 보고 12월 31일까지 · 내일 2시 면담 알림 10분 전 · 할 일: 보고서 제출</p>
        <div class="qs-tpl" id="qsTpl" hidden></div>
      </div>
      <div class="account" id="account">
        <span class="badge" id="modeBadge" hidden>데모</span>
        <button class="btn ghost" id="authBtn" type="button">구글 연결</button>
      </div>
    </header>
    <div class="qs-scrim" id="qsScrim"></div>

    <!-- 데스크톱: 왼쪽 막대. 휴대폰: ☰ 로 여는 캘린더·설정 시트 -->
    <aside class="sidebar" id="sidebar">
      <!-- 데스크톱 왼쪽 어두운 막대: 앱 이름 + ＋ / 큰 연·월 + 미니 달력 / 날짜별 일정 / 캘린더 묶음 -->
      <div class="sb-top">
        <div class="brand">
          <img src="icons/icon-v12.svg" alt="" width="22" height="22">
          <span id="appName">JB's 캘린더</span>
        </div>
        <button class="sb-plus" id="plusBtn" type="button" aria-label="새 일정 빠른 입력" title="새 일정 빠른 입력 (N)">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="m-menu-head">
        <strong>캘린더</strong>
        <button type="button" class="qs-btn strong" id="menuDone">완료</button>
      </div>
      <div class="m-menu-acts">
        <button type="button" id="mTodayBtn">오늘로 이동</button>
        <button type="button" id="mViewBtn">3일 보기</button>
        <button type="button" id="mDayBtn">일 보기</button>
        <button type="button" id="mTasksBtn">할 일</button>
      </div>
      <section class="mini" id="mini"></section>
      <!-- 데스크톱 왼쪽: 날짜별 일정 / 할 일 목록 바꾸기 -->
      <div class="sb-tabs" id="sbTabs" role="tablist">
        <button type="button" id="sbEvTab" data-sbtab="ev" role="tab">일정</button>
        <button type="button" id="sbTasksTab" data-sbtab="tasks" role="tab">할 일</button>
      </div>
      <section class="upcoming">
        <h2 class="side-h">다가오는 일정</h2>
        <div id="upcoming"></div>
      </section>
      <section class="sb-tasks tp-host" id="sbTasks" aria-label="할 일" hidden></section>
      <section class="cals" id="calsPanel">
        <h2 class="side-h">캘린더</h2>
        <div class="acct-slot" id="acctSlot"></div>
        <div id="calList"></div>
        <div class="cal-set">
          <label class="cs-row">주 시작
            <select id="weekStartSel">
              <option value="1">월요일</option>
              <option value="0">일요일</option>
            </select>
          </label>
          <label class="cs-row">기본 캘린더 <select id="defCalSel" aria-label="새 일정 기본 캘린더"></select></label>
          <label class="cs-row">기본 길이
            <select id="defDurSel" aria-label="새 일정 기본 길이">
              <option value="15">15분</option><option value="30">30분</option><option value="60">1시간</option>
              <option value="90">1시간 30분</option><option value="120">2시간</option>
            </select>
          </label>
          <label class="cs-row">주 번호 표시 <input type="checkbox" id="weekNumChk"></label>
          <div class="cs-row cs-sets">캘린더 묶음
            <select id="setSel" aria-label="캘린더 묶음"></select>
          </div>
          <div class="cs-btns"><button type="button" class="link-btn" id="setSave">지금 켠 캘린더를 묶음으로 저장</button><button type="button" class="link-btn" id="setDel" hidden>이 묶음 지우기</button></div>
          <button type="button" class="link-btn" id="unhideBtn" hidden></button>
        </div>
      </section>
      <div class="sb-foot">
        <input type="checkbox" id="allCals" aria-label="모든 캘린더 보기">
        <button type="button" class="sb-set" id="calSetBtn" aria-haspopup="true"><span id="calSetLabel">모든 캘린더</span> <svg viewBox="0 0 12 12" width="9" height="9"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </aside>

    <main class="main">
      <!-- 휴대폰 위쪽: 큰 연·월 제목(누르면 오늘로) + 월 달력(손잡이로 한 주까지 접힘) -->
      <div class="m-head">
        <button class="m-month" id="monthToggle" aria-label="오늘로 이동"><span id="mTitle"></span></button>
      </div>
      <div class="ticker" id="ticker"></div>

      <div class="toolbar">
        <div class="nav">
          <button class="icon-btn" id="prevBtn" aria-label="이전">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn" id="todayBtn">오늘</button>
          <button class="icon-btn" id="nextBtn" aria-label="다음">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <h1 class="title" id="title"></h1>
        <div class="seg" id="viewSeg" role="tablist">
          <button data-view="day">일</button>
          <button data-view="week">주</button>
          <button data-view="month">월</button>
          <button data-view="quarter">분기</button>
          <button data-view="year">연</button>
        </div>
        <div class="d-search" id="dSearchBox">
          <label class="ds-box">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <input id="dSearch" type="search" placeholder="검색" aria-label="일정 검색" autocomplete="off">
          </label>
          <div class="ds-pop" id="dSearchPop" hidden><div class="ds-list" id="dSearchList"></div></div>
        </div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="banner ask" id="askBanner" hidden>
        <span>할 일(Google Tasks)을 보려면 구글 권한을 한 번 더 허용해 주세요.</span>
        <span class="ask-btns"><button type="button" class="btn small primary" data-act="tasks-consent">허용하기</button><button type="button" class="btn small ghost" data-act="tasks-later">나중에</button></span>
      </div>
      <div class="view" id="view"></div>

    </main>

    <!-- 휴대폰 아래 떠 있는 막대: ☰ 캘린더·설정 / 새 일정 빠른 입력 / 검색 · 새 일정 편집 -->
    <nav class="m-bar" id="mBar">
      <button class="mb-round" id="menuBtn" aria-label="캘린더·설정">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="mb-pill mb-quick" id="quickBtn"><span>새 일정…</span></button>
      <div class="mb-pill mb-pair">
        <button id="searchBtn" aria-label="일정 검색">
          <svg viewBox="0 0 24 24" width="25" height="25"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button id="addBtn" aria-label="새 일정 만들기">
          <svg viewBox="0 0 24 24" width="25" height="25"><path d="M12 4.5v15M4.5 12h15" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
        </button>
      </div>
    </nav>

    <div class="m-search" id="searchSheet" role="dialog" aria-label="일정 검색">
      <div class="ms-head">
        <label class="ms-box">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" enterkeyhint="search" placeholder="제목·장소·메모 검색" aria-label="일정 검색" autocomplete="off">
        </label>
        <button type="button" class="qs-btn" id="searchCancel">취소</button>
      </div>
      <div class="ms-list ag-main m-list" id="searchList"></div>
    </div>

    <!-- 휴대폰 할 일 화면(☰ → 할 일). 내용은 데스크톱 왼쪽 「할 일」과 같은 tp-host 로 그린다 -->
    <div class="m-tasks" id="tasksSheet" role="dialog" aria-label="할 일">
      <div class="mt-head">
        <strong>할 일</strong>
        <button type="button" class="qs-btn strong" id="tasksDone">완료</button>
      </div>
      <div class="mt-body tp-host" id="tasksBody"></div>
    </div>
  </div>

  <dialog class="editor" id="editor">
    <form method="dialog" id="editorForm">
      <div class="ed-head">
        <span class="ed-dot" id="edDot"></span>
        <input name="title" class="ed-title" placeholder="제목" required>
      </div>
      <p class="ed-note ed-parse" id="edParse" hidden></p>
      <p class="ed-note" id="edNote" hidden></p>
      <div class="ed-group">
        <label class="row">캘린더 <select name="calendarId"></select></label>
      </div>
      <div class="ed-group">
        <label class="row switch">종일 <input type="checkbox" name="allDay"></label>
        <div class="row two">
          <span>시작</span>
          <input type="date" name="sDate" required><input type="time" name="sTime" step="300">
        </div>
        <div class="row two">
          <span>종료</span>
          <input type="date" name="eDate" required><input type="time" name="eTime" step="300">
        </div>
        <label class="row">반복 <select name="repeat" aria-label="반복"></select></label>
        <div class="row rep-end" id="edRepEnd" hidden>
          <span>끝</span>
          <span class="rep-end-in">
            <select name="repeatEnd" aria-label="반복 끝"><option value="never">계속</option><option value="until">날짜까지</option><option value="count">횟수</option></select>
            <input type="date" name="repeatUntil" aria-label="반복 끝 날짜"><input type="number" name="repeatCount" min="1" max="730" value="10" aria-label="반복 횟수">
          </span>
        </div>
        <p class="ed-sub" id="edRepText" hidden></p>
        <div class="row al-row"><span>알림</span>
          <div class="alerts" id="edAlerts">
            <select name="reminder" class="al-sel" aria-label="알림">
              <option value="none">없음</option>
              <option value="default">기본</option>
              <option value="0">일정 시작</option>
              <option value="5">5분 전</option>
              <option value="10">10분 전</option>
              <option value="15">15분 전</option>
              <option value="30">30분 전</option>
              <option value="60">1시간 전</option>
              <option value="120">2시간 전</option>
              <option value="1440">1일 전</option>
              <option value="2880">2일 전</option>
              <option value="10080">1주 전</option>
            </select>
            <button type="button" class="link-btn al-add" id="edAlAdd">＋ 알림 추가</button>
          </div>
        </div>
        <label class="row">시간대 <select name="tz" aria-label="시간대"></select></label>
        <p class="ed-sub" id="edTzText" hidden></p>
        <label class="row">표시 <select name="avail" aria-label="바쁨·한가함"><option value="busy">바쁨</option><option value="free">한가함</option></select></label>
      </div>
      <div class="ed-group">
        <label class="row">장소 <input name="location" placeholder="장소 추가"></label>
        <label class="row">URL <input name="url" type="url" inputmode="url" placeholder="https://"></label>
        <label class="row col">메모 <textarea name="note" rows="3" placeholder="메모"></textarea></label>
      </div>
      <div class="ed-group">
        <div class="row col att-row"><span>참석자</span>
          <div class="att-list" id="edAtt"></div>
          <input name="attIn" type="email" inputmode="email" enterkeyhint="done" placeholder="이메일 넣고 Enter" aria-label="참석자 이메일 추가">
        </div>
        <label class="row switch" id="edNotifyRow" hidden>참석자에게 메일 보내기 <input type="checkbox" name="notify"></label>
        <label class="row switch" id="edMeetRow">Google Meet 화상회의 추가 <input type="checkbox" name="addMeet"></label>
      </div>
      <a class="ed-link" id="edMeet" target="_blank" rel="noopener" hidden>화상회의 참가 ↗</a>
      <a class="ed-link" id="edUrl" target="_blank" rel="noopener" hidden>URL 열기 ↗</a>
      <a class="ed-link" id="edLink" target="_blank" rel="noopener" hidden>구글 캘린더에서 열기 ↗</a>
      <div class="ed-actions">
        <button type="button" class="btn danger" id="edDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="edCancel">취소</button>
        <button type="submit" class="btn primary" id="edSave">저장</button>
      </div>
    </form>
  </dialog>

  <dialog class="editor" id="taskEditor">
    <form method="dialog" id="taskForm">
      <div class="ed-head">
        <span class="tsk-box ed-tbox" id="tfBox" aria-hidden="true"></span>
        <input name="title" class="ed-title" placeholder="할 일" required>
      </div>
      <div class="ed-group">
        <label class="row">목록 <select name="listId"></select></label>
        <label class="row switch">마감일 <input type="checkbox" name="hasDue"></label>
        <label class="row" id="tfDueRow">날짜 <input type="date" name="due"></label>
        <label class="row switch">완료 <input type="checkbox" name="done"></label>
      </div>
      <div class="ed-group">
        <label class="row col">메모 <textarea name="notes" rows="3" placeholder="메모"></textarea></label>
      </div>
      <a class="ed-link" id="tfLink" target="_blank" rel="noopener" hidden>구글 할 일에서 열기 ↗</a>
      <div class="ed-actions">
        <button type="button" class="btn danger" id="tfDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="tfCancel">취소</button>
        <button type="submit" class="btn primary" id="tfSave">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 확인·선택 시트: 삭제 확인(반복이면 이 일정만/이후 모두), 길게 누름·「더 보기」 메뉴, 날짜 옮기기 -->
  <dialog class="ask" id="ask" aria-labelledby="askTitle"></dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
