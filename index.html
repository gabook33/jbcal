<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JB's 캘린더</title>
  <meta name="description" content="JB 전용 캘린더">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JB's 캘린더">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 데스크톱: 위쪽 막대(이름 + 빠른 입력 + 계정). 휴대폰: 빠른 입력만 아래에서 올라오는 시트로 쓴다 -->
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span id="appName">JB's 캘린더</span>
      </div>
      <div class="qsheet" id="quickSheet" role="dialog" aria-label="새 일정 빠른 입력">
        <div class="qs-grab"></div>
        <div class="qs-head">
          <button type="button" class="qs-btn" id="qsCancel">취소</button>
          <strong>새 일정</strong>
          <button type="submit" class="qs-btn strong" id="qsAdd" form="quickForm">추가</button>
        </div>
        <form class="quick" id="quickForm" autocomplete="off">
          <svg class="quick-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="quick" type="text" enterkeyhint="done"
            placeholder="빠른 입력: 내일 오후 3시 팀 회의 @본관 /업무" aria-label="자연어로 일정 추가">
          <div class="quick-preview" id="quickPreview" hidden></div>
        </form>
        <p class="qs-hint">예) 내일 오후 3시 팀 회의 @본관 /업무 · 다음주 금요일 7시~9시 저녁 · 모레 종일 연차 · 3일 후 마감</p>
      </div>
      <div class="account" id="account">
        <span class="badge" id="modeBadge" hidden>데모</span>
        <button class="btn ghost" id="authBtn" type="button">구글 연결</button>
      </div>
    </header>
    <div class="qs-scrim" id="qsScrim"></div>

    <!-- 데스크톱: 왼쪽 막대. 휴대폰: 「캘린더」 탭 화면 -->
    <aside class="sidebar" id="sidebar">
      <section class="mini" id="mini"></section>
      <section class="upcoming">
        <h2 class="side-h">다가오는 일정</h2>
        <div id="upcoming"></div>
      </section>
      <section class="cals">
        <h2 class="side-h">캘린더</h2>
        <div class="acct-slot" id="acctSlot"></div>
        <div id="calList"></div>
      </section>
    </aside>

    <main class="main">
      <!-- 휴대폰 위쪽: 달 이름 + 주간 날짜 줄(펼치면 월 달력) -->
      <div class="m-head">
        <button class="m-month" id="monthToggle" aria-expanded="false" aria-controls="ticker">
          <span id="mTitle"></span>
          <svg class="chev" viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="icon-btn" id="tkPrev" aria-label="이전 주">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="tkNext" aria-label="다음 주">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="mViewBtn" aria-label="3일 보기로 전환">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.2 4.5v15M14.8 4.5v15" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="m-today" id="mTodayBtn">오늘</button>
      </div>
      <div class="ticker" id="ticker"></div>

      <div class="toolbar">
        <div class="nav">
          <button class="icon-btn" id="prevBtn" aria-label="이전">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn" id="todayBtn">오늘</button>
          <button class="icon-btn" id="nextBtn" aria-label="다음">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <h1 class="title" id="title"></h1>
        <div class="seg" id="viewSeg" role="tablist">
          <button data-view="list">목록</button>
          <button data-view="day">일</button>
          <button data-view="week">주</button>
          <button data-view="month">월</button>
        </div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="view" id="view"></div>

      <!-- 휴대폰 「할 일」 탭: 아직 연동 없음 -->
      <section class="todo-panel" id="todoPanel">
        <h2 class="panel-h">할 일</h2>
        <div class="todo-empty">
          <svg viewBox="0 0 48 48" width="56" height="56"><rect x="8" y="8" width="32" height="32" rx="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 24.5l5 5 9-11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <strong>할 일이 없습니다</strong>
          <p>할 일 연동은 아직 지원하지 않습니다.<br>일정은 + 버튼으로 추가하세요.</p>
        </div>
      </section>
    </main>

    <button class="fab" id="fab" aria-label="새 일정">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <nav class="tabbar" id="tabbar" role="tablist">
      <button data-tab="events" class="on" role="tab">
        <svg viewBox="0 0 24 24" width="25" height="25"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 13.5h4M7.5 16.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>일정</span>
      </button>
      <button data-tab="calendars" role="tab">
        <svg viewBox="0 0 24 24" width="25" height="25"><circle cx="6" cy="7" r="2" fill="currentColor"/><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="6" cy="17" r="2" fill="currentColor"/><path d="M10.5 7h9M10.5 12h9M10.5 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>캘린더</span>
      </button>
      <button data-tab="todos" role="tab">
        <svg viewBox="0 0 24 24" width="25" height="25"><rect x="4" y="4" width="16" height="16" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.2l2.5 2.5 4.5-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>할 일</span>
      </button>
    </nav>
  </div>

  <dialog class="editor" id="editor">
    <form method="dialog" id="editorForm">
      <div class="ed-head">
        <span class="ed-dot" id="edDot"></span>
        <input name="title" class="ed-title" placeholder="제목" required>
      </div>
      <p class="ed-note" id="edNote" hidden></p>
      <div class="ed-group">
        <label class="row">캘린더 <select name="calendarId"></select></label>
      </div>
      <div class="ed-group">
        <label class="row switch">종일 <input type="checkbox" name="allDay"></label>
        <div class="row two">
          <span>시작</span>
          <input type="date" name="sDate" required><input type="time" name="sTime" step="300">
        </div>
        <div class="row two">
          <span>종료</span>
          <input type="date" name="eDate" required><input type="time" name="eTime" step="300">
        </div>
        <label class="row">알림
          <select name="reminder">
            <option value="none">없음</option>
            <option value="default">기본</option>
            <option value="5">5분 전</option>
            <option value="10">10분 전</option>
            <option value="15">15분 전</option>
            <option value="30">30분 전</option>
            <option value="60">1시간 전</option>
            <option value="1440">1일 전</option>
          </select>
        </label>
      </div>
      <div class="ed-group">
        <label class="row">장소 <input name="location" placeholder="장소 추가"></label>
        <label class="row col">메모 <textarea name="note" rows="3" placeholder="메모"></textarea></label>
      </div>
      <a class="ed-link" id="edLink" target="_blank" rel="noopener" hidden>구글 캘린더에서 열기 ↗</a>
      <div class="ed-actions">
        <button type="button" class="btn danger" id="edDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="edCancel">취소</button>
        <button type="submit" class="btn primary" id="edSave">저장</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
