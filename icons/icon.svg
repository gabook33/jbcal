<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- JB's 캘린더 앱 아이콘: 사무실 윈도우 앱(jbcal.ico)과 같은 단순한 달력 — 빨간 윗부분 + 날짜 숫자 -->
  <defs>
    <clipPath id="card"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="16" y="16" width="480" height="480" fill="#ffffff"/>
    <rect x="16" y="16" width="480" height="150" fill="#e53935"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="6"/>
  <!-- 고리 두 개 -->
  <rect x="146" y="58" width="30" height="66" rx="15" fill="#ffffff"/>
  <rect x="336" y="58" width="30" height="66" rx="15" fill="#ffffff"/>
  <text x="256" y="420" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="250" letter-spacing="-8" fill="#202124">17</text>
</svg>
